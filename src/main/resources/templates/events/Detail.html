<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4" th:text="${event.nombre}"></h1>

    <p><strong>ID:</strong> <span th:text="${event.id}"></span></p>
    <p><strong>Fecha:</strong> <span th:text="${event.fecha}"></span></p>
    <p><strong>Descripción:</strong> <span th:text="${event.descripcion}"></span></p>

    <a th:href="@{/admin/events/{id}/editar(id=${event.id})}" class="btn btn-warning">Editar</a>

    <form th:action="@{/admin/events/{id}/eliminar(id=${event.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn btn-danger"
                onclick="return confirm('¿Seguro que quieres eliminar este evento?')">
            Eliminar
        </button>
    </form>

    <a th:href="@{/admin/events}" class="btn btn-secondary">Volver</a>
</div>
</body>
</html>
