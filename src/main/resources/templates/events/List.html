<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventify - Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Panel de eventos</h1>
        <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#buscarModal">
            Buscar por ID
        </button>
        <a th:href="@{/admin/events/nuevo}" class="btn btn-primary">Nuevo evento</a>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(events)}" class="alert alert-info">Actualmente no hay eventos programados</div>
    <table th:unless="${#lists.isEmpty(events)}" class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Descripcion</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="evento:${events}">
                <td th:text="${evento.id}"></td>
                <td th:text="${evento.nombre}"></td>
                <td th:text="${evento.fecha}"></td>
                <td th:text="${evento.descripcion}"></td>
                <td>
                    <a th:href="@{/admin/events/{id}/editar(id=${evento.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/admin/events/{id}/eliminar(id=${evento.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Desea eliminar este evento?')">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/admin/venue}" class="btn btn-outline-secondary mt-3">Ver Lugares</a>
    <a th:href="@{/}" class="btn btn-outline-secondary mt-3">Volver al inicio</a>
</div>

<nav th:if="${paginator.totalPages > 1}" aria-label="Paginación de eventos" class="mt-4">
    <ul class="pagination justify-content-center">

        <li class="page-item" th:classappend="${!paginator.hasPrevious()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/events(page=${paginator.number - 1}, size=${paginator.size})}">&laquo;</a>
        </li>

        <li class="page-item" th:each="i : ${#numbers.sequence(0, paginator.totalPages - 1)}"
            th:classappend="${i == paginator.number} ? 'active'">
            <a class="page-link"
               th:href="@{/admin/events(page=${i}, size=${paginator.size})}"
               th:text="${i + 1}"></a>
        </li>

        <li class="page-item" th:classappend="${!paginator.hasNext()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/events(page=${paginator.number + 1}, size=${paginator.size})}">&raquo;</a>
        </li>

    </ul>
</nav>

<div class="modal fade" id="buscarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/events/buscar}" method="get">
                <div class="modal-header">
                    <h5 class="modal-title">Buscar evento por ID</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="number" name="id" class="form-control" placeholder="Ingresa el ID" required min="1">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
