<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4" th:text="${venue.nombre}"></h1>

    <p><strong>ID:</strong> <span th:text="${venue.id}"></span></p>
    <p><strong>Direccion:</strong> <span th:text="${venue.direccion}"></span></p>
    <p><strong>Capacidad:</strong> <span th:text="${venue.capacidad}"></span></p>

    <a th:href="@{/admin/venue/{id}/editar(id=${venue.id})}" class="btn btn-warning">Editar</a>

    <form th:action="@{/admin/venue/{id}/eliminar(id=${venue.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn btn-danger"
                onclick="return confirm('¿Seguro que quieres eliminar este lugar?')">
            Eliminar
        </button>
    </form>

    <a th:href="@{/admin/venue}" class="btn btn-secondary">Volver</a>
</div>
</body>
</html>
