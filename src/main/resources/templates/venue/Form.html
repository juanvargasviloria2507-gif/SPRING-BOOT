<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${venue.id} != null ? 'Editar lugar' : 'Nuevo lugar'">Eventify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px">
    <h1 class="mb-4" th:text="${venue.id} != null ? 'Editar Lugar' : 'Nuevo Lugar'"></h1>
    <form th:action="${venue.id} != null ? '/admin/venue/' + ${venue.id} + '/actualizar' : '/admin/venue/crear'"
          th:object="${venue}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Direccion</label>
            <input type="text" class="form-control" th:field="*{direccion}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Capacidad</label>
            <input type="number" class="form-control" th:field="*{capacidad}" required min="1">
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/admin/venue}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
